[tools]
python = "3.12"

[tasks.setup]
description = "Create Python environment and download pinned reference CAD tools (macOS)"
run = "python3.12 scripts/setup.py"

[tasks.reference]
description = "Render upstream SCAD comparison cases into artifacts/reference"
run = ".venv/bin/python scripts/reference.py"

[tasks.build]
description = "Bundle local source into one FeatureScript file and line map (offline)"
run = "python3.12 scripts/build.py"

[tasks.compare]
description = "Compare exported STEP parts against their reference STL counterparts"
run = ".venv/bin/python scripts/compare.py --batch"

[tasks.validation]
description = "Build a temporary FeatureScript validation feature with named cases (offline)"
run = ".venv/bin/python scripts/validation.py"

[tasks.test]
description = "Build the generated bundle and test local tooling"
depends = ["build"]
run = ".venv/bin/python -m pytest -q"

[tasks."build:check"]
description = "Check that the generated bundle matches local source (offline)"
run = "python3.12 scripts/build.py --check"

[tasks."release:prepare"]
description = "Build release files and generate the PDF guide locally"
run = ".venv/bin/python scripts/build.py && .venv/bin/python scripts/release.py --prepare"
